<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de edad</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="edad.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <h1>Calculadora de edad</h1>
        <p>Ingresa tu fecha de nacimiento.</p>

        <form id="formEdad">
            <label for="dia">Día:</label>
            <select id="dia" required>
                <option value="">Selecciona el día</option>

                <option value="0">1</option>
                <option value="1">2</option>
                <option value="2">3</option>
                <option value="3">4</option>
                <option value="4">5</option>
                <option value="5">6</option>
                <option value="6">7</option>
                <option value="7">8</option>
                <option value="8">9</option>
                <option value="9">10</option>
                <option value="10">11</option>
                <option value="11">12</option>
                 <option value="0">13</option>
                <option value="1">14</option>
                <option value="2">15</option>
                <option value="3">16</option>
                <option value="4">17</option>
                <option value="5">18</option>
                <option value="6">19</option>
                <option value="7">20</option>
                <option value="8">21</option>
                <option value="9">22</option>
                <option value="10">23</option>
                <option value="11">24</option>
                <option value="1">25</option>
                <option value="2">26</option>
                <option value="3">27</option>
                <option value="4">28</option>
                <option value="5">29</option>
                <option value="6">30</option>
                <option value="7">31</option>
            </select
            
 </select>

            <label for="mes">Mes:</label>
            <select id="mes" required>
                <option value="">Selecciona el mes</option>
                <option value="0">Enero</option>
                <option value="1">Febrero</option>
                <option value="2">Marzo</option>
                <option value="3">Abril</option>
                <option value="4">Mayo</option>
                <option value="5">Junio</option>
                <option value="6">Julio</option>
                <option value="7">Agosto</option>
                <option value="8">Septiembre</option>
                <option value="9">Octubre</option>
                <option value="10">Noviembre</option>
                <option value="11">Diciembre</option>
            </select>

            <label for="anio">Año:</label>
            <input type="number" id="anio"
                   min="1900" placeholder="Ej. 2004" required>

            <button type="submit">Calcular edad</button>
        </form>

        <p id="resultado"></p>
    </main>
</body>
</html>
